[package]
name = "mollie"
version = "0.0.1"
edition = "2024"

[lints]
workspace = true

[features]
default = ["ariadne"]
ariadne = ["mollie-typing/ariadne"]

[dependencies]
mollie-shared = { workspace = true }
mollie-compiler = { workspace = true }
mollie-typing = { workspace = true }
mollie-ir = { workspace = true }
mollie-const = { workspace = true }
mollie-index = { workspace = true }
mollie-parser = { workspace = true }
mollie-typed-ast = { workspace = true }

[dev-dependencies]
ariadne = "0.6.0"
bitflags = "2.13.2"
tiny-skia = "0.12.0"
tracing.workspace = true
tracing-subscriber = "0.3.23"

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.lints.clippy]
all = "warn"
nursery = "warn"
pedantic = "warn"
absolute_paths = { level = "warn", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
too_many_lines = { level = "allow", priority = 1 }

[workspace.dependencies]
mollie-shared = { path = "./crates/shared" }
mollie-lexer = { path = "./crates/lexer" }
mollie-const = { path = "./crates/const" }
mollie-index = { path = "./crates/index" }
mollie-typed-ast = { path = "./crates/typed-ast" }
mollie-ir = { path = "./crates/ir" }
mollie-parser = { path = "./crates/parser" }
mollie-compiler = { path = "./crates/compiler" }
mollie-typing = { path = "./crates/typing" }

cranelift = { version = "0.136.1", features = [
    "jit",
    "module",
    "interpreter",
    "object",
    "native",
    "core",
] }

serde = { version = "1.0.229", features = ["derive", "rc"] }
derive_more = { version = "2.1.1", features = [
    "display",
    "is_variant",
    "unwrap",
] }
indexmap = "2.14.2"
peekmore = { version = "1.3.0", features = ["smallvec"] }

tracing = "0.1.44"
